# ~/.config/tmux/tmux.conf  (symlink -> ~/.config/nvim/tmux)
# Reload: prefix r

# ---------------------------------------------------------------- prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # C-a C-a sends a real C-a (start of line in shell)

# ---------------------------------------------------------------- basics
set -g mouse on               # click panes, drag borders to resize, scroll
set -g history-limit 50000
set -g base-index 1           # windows start at 1
setw -g pane-base-index 1     # panes start at 1
set -g renumber-windows on    # no gaps after closing a window
set -g escape-time 10         # no Esc delay in nvim
set -g focus-events on        # nvim autoread / gitsigns refresh
set -g display-time 2000
set -g status-interval 5
set -g set-titles on
set -g detach-on-destroy off  # closing last window of a session -> switch to another session

# true color + undercurl for nvim
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",*:usstyle"

# clipboard: copies go to the system clipboard via OSC 52 (works over SSH too)
set -g set-clipboard on
set -g allow-passthrough on

# ---------------------------------------------------------------- keys
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# splits & windows open in the current directory
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# resize panes with prefix + h/j/k/l (hold to repeat)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z      # zoom pane on/off

# C-l is taken by pane navigation -> prefix C-l clears the screen
bind C-l send-keys C-l

# copy mode like vim: prefix [ , v select, C-v block, y copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---------------------------------------------------------------- plugins (TPM)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'   # C-h/j/k/l across tmux panes and nvim splits
set -g @plugin 'tmux-plugins/tmux-resurrect'      # prefix C-s save, prefix C-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'      # auto-save every 15 min, auto-restore on start

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# ---------------------------------------------------------------- theme: catppuccin mocha
# Installed outside TPM (recommended by catppuccin), managed by install.sh
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_window_flags 'icon'
set -g @catppuccin_date_time_text ' %H:%M'
set -g @catppuccin_directory_text ' #{b:pane_current_path}'
run '~/.tmux/plugins/catppuccin/tmux/catppuccin.tmux'

set -g status-position top
set -g status-left-length 100
set -g status-right-length 100
set -g status-left '#{E:@catppuccin_status_session} '
set -g status-right '#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}'

# Initialize TPM (keep at the very bottom; continuum needs to be last in status-right)
run '~/.tmux/plugins/tpm/tpm'
